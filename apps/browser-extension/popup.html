<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PocketDL Capture</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { width: 360px; margin: 0; padding: 16px; background: #0a1020; color: #edf2ff; }
    h1 { margin: 0 0 4px; font-size: 20px; }
    #version { font-size: 11px; font-weight: 400; color: #8491aa; }
    p { margin: 0 0 12px; color: #8f9cb5; font-size: 12px; }
    label { display: block; font-size: 11px; color: #8996ae; margin-bottom: 5px; }
    input { width: 100%; box-sizing: border-box; border-radius: 9px; border: 1px solid #2a3652; background: #10182a; color: #fff; padding: 9px; }
    button { border: 0; border-radius: 9px; padding: 8px 10px; background: #dfe8ff; color: #081021; font-weight: 700; cursor: pointer; }
    button.save { margin-top: 8px; width: 100%; background: #2f6df6; color: #fff; }
    button.download { width: 100%; margin-top: 7px; }
    button:disabled { opacity: .6; cursor: default; }
    #status { margin: 12px 0; font-size: 12px; color: #aeb9ce; }
    .capture { display: block; border: 1px solid #25324c; border-radius: 10px; margin-top: 8px; background: #10182a; overflow: hidden; }
    .capture summary { cursor: pointer; list-style: none; padding: 10px; display: grid; gap: 4px; }
    .capture summary::-webkit-details-marker { display: none; }
    .capture summary::after { content: '＋'; justify-self: end; grid-row: 1 / span 2; grid-column: 2; color: #7d8aa4; }
    .capture[open] summary::after { content: '−'; }
    .capture-title { overflow-wrap: anywhere; font-weight: 700; }
    .capture-meta, .capture-body span, .capture-body small, .muted { color: #8491aa; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .capture-warning { display: inline-block; padding: 3px 6px; border-radius: 999px; background: #3a2720; color: #ffbe92; font-size: 10px; font-weight: 700; white-space: normal; }
    .capture-body { padding: 0 10px 10px; display: grid; gap: 5px; }
    .capture-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 6px; }
    button.secondary { background: #1c2740; color: #cdd8f2; }
    .capture-progress { margin-top: 7px; font-size: 12px; color: #aeb9ce; }
    .capture-downloaded { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 7px; font-size: 12px; color: #9fe6b0; }
    .capture-downloaded button { padding: 6px 10px; margin-top: 0; }
    .capture-error { margin-top: 4px; font-size: 11px; color: #ffbe92; }
    .capture-quality { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
    button.quality { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 5px 8px; margin-top: 0; border-radius: 8px; background: #131b2e; color: #cdd8f2; font-size: 11px; font-weight: 700; }
    button.quality small { color: #8491aa; font-size: 9px; font-weight: 400; }
    button.quality.selected { background: #22345c; color: #eaf0ff; }
    #banner { display: none; margin: 10px 0; padding: 8px 10px; border-radius: 9px; background: #3a2720; color: #ffbe92; font-size: 11px; }
    #banner.visible { display: grid; gap: 6px; }
    #banner button.dismiss { justify-self: start; background: transparent; color: #ffbe92; text-decoration: underline; padding: 0; font-weight: 400; }
    #send-banner { display: none; margin: 10px 0; padding: 8px 10px; border-radius: 9px; background: #3a2720; color: #ffbe92; font-size: 11px; }
    #send-banner.visible { display: grid; gap: 6px; }
    #send-banner.ok { background: #17301f; color: #9fe6b0; }
    #send-banner button.dismiss { justify-self: start; background: transparent; color: inherit; text-decoration: underline; padding: 0; font-weight: 400; }
  </style>
</head>
<body>
  <h1>PocketDL Capture <span id="version" class="muted"></span></h1>
  <p>Detects HLS, DASH and direct media requests and sends them to local PocketDL.</p>
  <form id="settings">
    <label for="backend-url">PocketDL backend</label>
    <input id="backend-url" placeholder="http://127.0.0.1:8787">
    <button class="save" type="submit">Save backend</button>
  </form>
  <div id="status">Checking…</div>
  <div id="banner"></div>
  <div id="send-banner"></div>
  <div id="captures"></div>
  <script type="module" src="dist/popup.js"></script>
</body>
</html>
