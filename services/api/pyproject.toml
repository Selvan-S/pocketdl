[project]
name = "pocketdl-api"
version = "0.2.4"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "aiosqlite>=0.21,<1.0",
  "python-multipart>=0.0.20,<1.0",
  "yt-dlp[default,curl-cffi]>=2026.7.4,<2027.0",
  "gallery-dl>=1.32.9,<2.0",
  "instaloader>=4.15.3,<5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=1.0,<2.0",
  "httpx2>=2.0,<3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
